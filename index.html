<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senhas Seguras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container"> 
    <header class="header">
      <h1>Gerador de Senhas</h1>
    </header>

    <section class="display-box" aria-label="Resultado da Senha">
      <output id="password" aria-live="polite">Clique em Gerar</output>
      <button type="button" class="copy-btn" id="copyBtn" title="Copiar para área de transferência">Copiar</button>
    </section>

    <section class="custom-section" aria-label="Configurações da Senha">
      <h2>Personalize sua senha</h2>

      <div class="control-group"> 
        <label for="lengthVal" class="control-label">Número de caracteres</label>

        <div class="counter">
          <button type="button" id="decrement" aria-label="Diminuir tamanho">-</button>
          <span id="lengthVal" aria-live="polite">12</span>
          <button type="button" id="increment" aria-label="Aumentar tamanho">+</button>
        </div>
      </div>

      <button type="button" class="generate-btn" id="generateBtn">Gerar Nova Senha</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
